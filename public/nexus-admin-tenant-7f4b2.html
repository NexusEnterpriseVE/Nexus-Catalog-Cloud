<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Nexus Catalog · Alta de tenant</title><style>body{font-family:system-ui;background:#0b1220;color:#e5edf8;margin:0;display:grid;place-items:center;min-height:100vh}.box{width:min(620px,92vw);background:#111a2c;border:1px solid #24324a;border-radius:22px;padding:26px;box-shadow:0 30px 80px #0006}h1{margin:0 0 6px}p{color:#9fb0c7}label{display:grid;gap:6px;margin:14px 0;font-size:13px}input{height:44px;border-radius:10px;border:1px solid #334155;background:#0b1220;color:white;padding:0 12px}button{height:46px;border:0;border-radius:11px;background:#2563eb;color:white;font-weight:800;width:100%;cursor:pointer}pre{white-space:pre-wrap;word-break:break-all;background:#07101f;border-radius:12px;padding:14px;color:#bfdbfe}</style></head><body><div class="box"><h1>Nexus Catalog Cloud</h1><p>Alta privada de catálogo. No compartas esta página ni la clave administrativa.</p><label>Clave administrativa<input id="secret" type="password"></label><label>Slug<input id="slug" placeholder="mi-empresa"></label><label>Nombre público<input id="name" placeholder="Mi Empresa"></label><label>WhatsApp / teléfono<input id="phone" placeholder="58412..."></label><label>Web<input id="website" placeholder="https://..."></label><button id="create">Crear catálogo y token</button><button id="rotate" style="margin-top:8px;background:#334155">Rotar token del slug</button><pre id="out">Esperando...</pre></div><script>document.querySelector('#create').onclick=async()=>{const out=document.querySelector('#out');out.textContent='Creando...';const r=await fetch('/api/admin-create-tenant',{method:'POST',headers:{'content-type':'application/json','x-admin-secret':document.querySelector('#secret').value},body:JSON.stringify({slug:document.querySelector('#slug').value,publicName:document.querySelector('#name').value,phone:document.querySelector('#phone').value,website:document.querySelector('#website').value})});out.textContent=JSON.stringify(await r.json(),null,2)}document.querySelector('#rotate').onclick=async()=>{const out=document.querySelector('#out');out.textContent='Rotando...';const r=await fetch('/api/admin-rotate-token',{method:'POST',headers:{'content-type':'application/json','x-admin-secret':document.querySelector('#secret').value},body:JSON.stringify({slug:document.querySelector('#slug').value})});out.textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
