<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Nexus Catalog · Alta de tenant</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:#0b1220;color:#e5edf8;margin:0;
      display:grid;place-items:center;min-height:100vh;padding:24px
    }
    .box{
      width:min(680px,96vw);background:#111a2c;border:1px solid #24324a;
      border-radius:22px;padding:28px;box-shadow:0 30px 80px #0006
    }
    h1{margin:0 0 6px}
    p{color:#9fb0c7;line-height:1.5}
    label{display:grid;gap:7px;margin:15px 0;font-size:13px;font-weight:650}
    input{
      height:46px;border-radius:11px;border:1px solid #334155;
      background:#0b1220;color:white;padding:0 12px;outline:none
    }
    input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px #2563eb22}
    button{
      height:48px;border:0;border-radius:12px;background:#2563eb;
      color:white;font-weight:800;width:100%;cursor:pointer
    }
    button.secondary{margin-top:9px;background:#334155}
    button:disabled{opacity:.55;cursor:not-allowed}
    pre{
      white-space:pre-wrap;word-break:break-word;background:#07101f;
      border:1px solid #172238;border-radius:12px;padding:15px;
      color:#bfdbfe;min-height:52px
    }
    pre.ok{color:#bbf7d0;border-color:#14532d}
    pre.error{color:#fecaca;border-color:#7f1d1d}
    .hint{font-size:12px;color:#7f91aa;margin-top:-6px}
  </style>
</head>
<body>
<div class="box">
  <h1>Nexus Catalog Cloud</h1>
  <p>Alta privada de catálogo. No compartas esta página ni la clave administrativa.</p>

  <label>
    Clave administrativa
    <input id="secret" type="password" autocomplete="current-password">
  </label>

  <label>
    Slug
    <input id="slug" placeholder="mi-empresa" autocomplete="off">
  </label>
  <div class="hint">Ejemplo: empresa-prueba-nexus</div>

  <label>
    Nombre público
    <input id="name" placeholder="Mi Empresa">
  </label>

  <label>
    WhatsApp / teléfono
    <input id="phone" placeholder="58412...">
  </label>

  <label>
    Web
    <input id="website" placeholder="https://...">
  </label>

  <button id="create" type="button">Crear catálogo y token</button>
  <button id="rotate" class="secondary" type="button">Rotar token del slug</button>

  <pre id="out">Esperando...</pre>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const out = $('out');
  const createBtn = $('create');
  const rotateBtn = $('rotate');

  function setOutput(message, type = '') {
    out.className = type;
    out.textContent = typeof message === 'string'
      ? message
      : JSON.stringify(message, null, 2);
  }

  async function parseResponse(response) {
    const text = await response.text();
    let payload;
    try {
      payload = text ? JSON.parse(text) : {};
    } catch {
      payload = { ok: false, error: text || `HTTP ${response.status}` };
    }

    if (!response.ok) {
      const msg = payload?.error || `Error HTTP ${response.status}`;
      throw new Error(msg);
    }
    return payload;
  }

  createBtn.addEventListener('click', async () => {
    const secret = $('secret').value.trim();
    const slug = $('slug').value.trim();
    const publicName = $('name').value.trim();
    const phone = $('phone').value.trim();
    const website = $('website').value.trim();

    if (!secret) return setOutput('Falta la clave administrativa.', 'error');
    if (!slug) return setOutput('Falta el slug.', 'error');
    if (!publicName) return setOutput('Falta el nombre público.', 'error');

    createBtn.disabled = true;
    rotateBtn.disabled = true;
    setOutput('Creando catálogo...');

    try {
      const response = await fetch('/api/admin-create-tenant', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-admin-secret': secret
        },
        body: JSON.stringify({
          slug,
          publicName,
          phone,
          website
        })
      });

      const data = await parseResponse(response);
      setOutput(data, 'ok');
    } catch (error) {
      setOutput({
        ok: false,
        error: error instanceof Error ? error.message : String(error)
      }, 'error');
    } finally {
      createBtn.disabled = false;
      rotateBtn.disabled = false;
    }
  });

  rotateBtn.addEventListener('click', async () => {
    const secret = $('secret').value.trim();
    const slug = $('slug').value.trim();

    if (!secret) return setOutput('Falta la clave administrativa.', 'error');
    if (!slug) return setOutput('Falta el slug.', 'error');

    createBtn.disabled = true;
    rotateBtn.disabled = true;
    setOutput('Rotando token...');

    try {
      const response = await fetch('/api/admin-rotate-token', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-admin-secret': secret
        },
        body: JSON.stringify({ slug })
      });

      const data = await parseResponse(response);
      setOutput(data, 'ok');
    } catch (error) {
      setOutput({
        ok: false,
        error: error instanceof Error ? error.message : String(error)
      }, 'error');
    } finally {
      createBtn.disabled = false;
      rotateBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
