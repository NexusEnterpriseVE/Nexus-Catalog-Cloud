<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>CUYRA Catalog · Alta privada</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:#0b1220;color:#e5edf8;margin:0;
      display:grid;place-items:center;min-height:100vh;padding:24px
    }
    .box{
      width:min(700px,96vw);background:#111a2c;border:1px solid #24324a;
      border-radius:22px;padding:28px;box-shadow:0 30px 80px #0006
    }
    .top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
    h1{margin:0 0 6px}
    .ver{
      font-size:11px;font-weight:800;letter-spacing:.08em;
      padding:7px 10px;border-radius:999px;background:#1d4ed8;color:white;
      white-space:nowrap
    }
    p{color:#9fb0c7;line-height:1.5}
    label{display:grid;gap:7px;margin:15px 0;font-size:13px;font-weight:650}
    input{
      height:46px;border-radius:11px;border:1px solid #334155;
      background:#0b1220;color:white;padding:0 12px;outline:none
    }
    input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px #2563eb22}
    button{
      height:48px;border:0;border-radius:12px;background:#2563eb;
      color:white;font-weight:800;width:100%;cursor:pointer
    }
    button.secondary{margin-top:9px;background:#334155}
    button.ghost{margin-top:9px;background:#172033;color:#bfdbfe}
    button:disabled{opacity:.55;cursor:not-allowed}
    .runtime{
      margin:16px 0 4px;padding:12px 14px;border-radius:12px;
      background:#3f1d1d;border:1px solid #7f1d1d;color:#fecaca;font-size:13px
    }
    .runtime.ok{background:#10291e;border-color:#166534;color:#bbf7d0}
    pre{
      white-space:pre-wrap;word-break:break-word;background:#07101f;
      border:1px solid #172238;border-radius:12px;padding:15px;
      color:#bfdbfe;min-height:70px
    }
    pre.ok{color:#bbf7d0;border-color:#14532d}
    pre.error{color:#fecaca;border-color:#7f1d1d}
    .hint{font-size:12px;color:#7f91aa;margin-top:-6px}
  </style>
</head>
<body>
<div class="box">
  <div class="top">
    <div>
      <h1>CUYRA Catalog Cloud</h1>
      <p>Alta privada de catálogo. No compartas esta página ni la clave administrativa.</p>
    </div>
    <div class="ver">V4.1.0</div>
  </div>

  <div id="runtime" class="runtime">
    Inicializando JavaScript… Si este mensaje no cambia, el archivo JS no se cargó.
  </div>

  <label>
    Clave administrativa
    <input id="secret" type="password" autocomplete="current-password">
  </label>

  <label>
    Slug
    <input id="slug" placeholder="mi-empresa" autocomplete="off">
  </label>
  <div class="hint">Ejemplo: empresa-prueba-nexus</div>

  <label>
    Nombre público
    <input id="name" placeholder="Mi Empresa">
  </label>

  <label>
    WhatsApp / teléfono
    <input id="phone" placeholder="58412...">
  </label>

  <label>
    Web
    <input id="website" placeholder="https://...">
  </label>

  <button id="create" type="button">Crear catálogo y token</button>
  <button id="rotate" class="secondary" type="button">Rotar token de sincronización</button>
  <button id="rotateSofia" class="secondary" type="button">Generar / rotar token privado de Sofía</button>
  <button id="testBackend" class="ghost" type="button">Probar backend /api/health</button>

  <pre id="out">Listo para operar.</pre>
</div>

<script src="/nexus-admin-tenant-7f4b2.js?v=400" defer></script>
</body>
</html>
